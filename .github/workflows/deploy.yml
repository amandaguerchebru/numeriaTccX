name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Publicar no servidor
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Substituir variaveis de ambiente no config.php
        run: |
          sed -i 's|\$host = "localhost";|$host = "${{ secrets.DB_HOST }}";|' config/conexao.php
          sed -i 's|\$porta = "3307";|$host = "3306";|' config/conexao.php
          sed -i 's|\$banco = "numeria";|$banco = "${{ secrets.DB_NAME }}";|' config/conexao.php
          sed -i 's|\$usuario = "root";|$usuario = "${{ secrets.DB_USER }}";|' config/conexao.php
          sed -i 's|\$senha = "";|$senha = "${{ secrets.DB_PASS }}";|' config/conexao.php

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /numeria.totalh.net/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
